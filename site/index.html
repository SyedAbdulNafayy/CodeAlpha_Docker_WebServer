<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Docker Web Server</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }
        .container {
            padding: 100px 20px;
        }
        h1 {
            color: #38bdf8;
            font-size: 38px;
        }
        p {
            font-size: 18px;
            color: #d1d5db;
        }
        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #166534;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to CodeAlpha!</h1>
        <p>My Docker Web Server is running successfully.</p>
        <p>Deployed using Nginx inside a Docker container.</p>
        <div class="status">Server Status: Online</div>
    </div>
</body>
</html>
